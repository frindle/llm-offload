; Standby (QUEUE_STANDBY=1, entrypoint sets QUEUE_BG_AUTOSTART=false): only queue-api starts; the other programs stay stopped.
; supervisord for the queue container: one program per launchd job (see PROCESS-MAP.md).
; Runs as the unprivileged user `queue` (the image's USER). Paths come from env that
; entrypoint.sh sets: HOME=/home/queue, QUEUE_STATE_DIR (default /home/queue/state).
;
; launchd -> supervisord
;   KeepAlive                 autorestart=true
;   ThrottleInterval N        throttle.sh N (min N s between starts)
;   ExitTimeOut N             stopwaitsecs=N (stopsignal TERM; never KILL early)
;   StartInterval N           every.sh N cmd
;   StartCalendarInterval     every.sh at HH:MM cmd
;   RunAtLoad                 autostart=true (interval jobs run once at start, as launchd does)
;   Nice 10                   nice -n 10
;   StandardOut/ErrorPath     stdout_logfile (stderr merged), no size cap (same as launchd)

[supervisord]
nodaemon=true
logfile=%(ENV_HOME)s/Library/Logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------- long-running jobs

; ollama-queue-daemon: KeepAlive, ThrottleInterval 30, ExitTimeOut 60.
; The env block is the plist's EnvironmentVariables (HOME/USER/PATH come from the image).
[program:queue-daemon]
command=/usr/local/bin/throttle.sh 30 python3 %(ENV_HOME)s/bin/ollama-queue.py run
directory=%(ENV_HOME)s/bin
autostart=%(ENV_QUEUE_BG_AUTOSTART)s
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=%(ENV_QUEUE_STATE_DIR)s/ollama-queue-daemon.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=GATE_AUTOFIX_MODE="live",GATE_PREGATE_HOST="unraid",GATE_PREGATE_MODEL="qwen3:14b",GATE_PREGATE_NUM_CTX="6144",GATE_TWO_TIER="1",BONSAI_CTX="65536"

; ollama-queue-api: KeepAlive, no env. The CPU lane runs inside this process.
; Listens on 0.0.0.0:7684 (api BIND_ADDR); the container's own IP is the only way in.
[program:queue-api]
command=python3 %(ENV_HOME)s/bin/ollama-queue-api.py
directory=%(ENV_HOME)s/bin
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/Library/Logs/ollama-queue-api.log
stdout_logfile_maxbytes=0
redirect_stderr=true

; queue-event-log: KeepAlive, ThrottleInterval 10. Loops itself (QEL_INTERVAL, default 10 s).
[program:queue-event-log]
command=/usr/local/bin/throttle.sh 10 python3 %(ENV_HOME)s/bin/queue-event-log.py
directory=%(ENV_HOME)s/bin
autostart=%(ENV_QUEUE_BG_AUTOSTART)s
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_QUEUE_STATE_DIR)s/ollama-queue-logs/queue-event-log.log
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------- interval jobs

; cpu-prefetch: StartInterval 60
[program:cpu-prefetch]
command=/usr/local/bin/every.sh 60 python3 %(ENV_HOME)s/bin/cpu-prefetch.py --once
directory=%(ENV_HOME)s/bin
autostart=%(ENV_QUEUE_BG_AUTOSTART)s
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
stdout_logfile=%(ENV_QUEUE_STATE_DIR)s/ollama-queue-logs/cpu-prefetch.log
stdout_logfile_maxbytes=0
redirect_stderr=true

; dispatch-ack-reconcile: StartInterval 300
[program:dispatch-ack-reconcile]
command=/usr/local/bin/every.sh 300 python3 %(ENV_HOME)s/bin/dispatch-ack-reconcile.py
directory=%(ENV_HOME)s/bin
autostart=%(ENV_QUEUE_BG_AUTOSTART)s
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
stdout_logfile=%(ENV_QUEUE_STATE_DIR)s/ollama-queue-logs/dispatch-ack-reconcile.log
stdout_logfile_maxbytes=0
redirect_stderr=true

; dispatch-escalation-watcher: StartInterval 300. Slow runs (a model review) get a longer stop wait.
[program:dispatch-escalation-watcher]
command=/usr/local/bin/every.sh 300 python3 %(ENV_HOME)s/bin/dispatch-escalation-watcher.py --once
directory=%(ENV_HOME)s/bin
autostart=%(ENV_QUEUE_BG_AUTOSTART)s
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
stdout_logfile=%(ENV_QUEUE_STATE_DIR)s/ollama-queue-logs/dispatch-escalation-watcher.log
stdout_logfile_maxbytes=0
redirect_stderr=true

; verify-orphan-reap: StartInterval 120, Nice 10
[program:verify-orphan-reap]
command=/usr/local/bin/every.sh 120 nice -n 10 python3 %(ENV_HOME)s/bin/verify-orphan-reap.py --apply
directory=%(ENV_HOME)s/bin
autostart=%(ENV_QUEUE_BG_AUTOSTART)s
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
stdout_logfile=%(ENV_QUEUE_STATE_DIR)s/ollama-queue-logs/verify-orphan-reap.log
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------- document-summary page

; docsum-ui: the private doc-summary web page (a KeepAlive launchd job on the Mac). It listens on the container's
; loopback only; the queue API reaches it through /docsum/* (docsum_proxy defaults to 127.0.0.1:7690, so docsum.upstream
; stays unset). Files arrive through its own upload route (POST /api/upload), never from a host path.
; Starts in standby too (it only serves pages); its upload and delete routes answer 503 there and while draining.
[program:docsum-ui]
command=python3 %(ENV_HOME)s/bin/docsum_server.py --host 127.0.0.1 --port 7690
directory=%(ENV_HOME)s/bin
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/.ollama-dispatch/docsum-ui.out
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------- calendar job

; log-rotate: StartCalendarInterval Hour 4 Minute 17 (daily, local time = container TZ), Nice 10.
; No RunAtLoad in the plist, so it does not run at start. Output file as in the plist.
[program:log-rotate]
command=/usr/local/bin/every.sh at 04:17 nice -n 10 python3 %(ENV_HOME)s/bin/log-rotate.py --apply
directory=%(ENV_HOME)s/bin
autostart=%(ENV_QUEUE_BG_AUTOSTART)s
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
stdout_logfile=%(ENV_HOME)s/.ollama-dispatch/log-rotate.out
stdout_logfile_maxbytes=0
redirect_stderr=true
